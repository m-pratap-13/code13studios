<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="stHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <filter id="cardSh2" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Device Screen BG -->
  <rect width="320" height="640" rx="36" fill="#F4F7FC"/>

  <!-- Status Bar -->
  <rect width="320" height="40" rx="36" fill="#1565C0"/>
  <rect width="320" height="20" fill="#1565C0"/>
  <text x="24" y="26" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">9:41</text>
  <rect x="120" y="8" width="80" height="18" rx="9" fill="#0A2540"/>
  <circle cx="282" cy="22" r="3" fill="#FFFFFF"/>
  <path d="M294 18H304V26H294V18Z" fill="#FFFFFF"/>

  <!-- App Header -->
  <rect y="40" width="320" height="60" fill="url(#stHeader)"/>
  <text x="20" y="76" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Students</text>
  <!-- Add button (+) -->
  <circle cx="285" cy="72" r="16" fill="#FFFFFF" fill-opacity="0.2"/>
  <text x="285" y="77" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">+</text>

  <!-- Search Input Bar -->
  <g transform="translate(16, 114)">
    <rect width="288" height="40" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="24" cy="20" r="6" stroke="#94A3B8" stroke-width="1.8"/>
    <line x1="28" y1="24" x2="33" y2="29" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
    <text x="44" y="24" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">Search student name or batch...</text>
  </g>

  <!-- Total count label -->
  <text x="20" y="174" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">ALL STUDENTS (48)</text>

  <!-- Student Card 1: Rahul Das -->
  <g transform="translate(16, 186)">
    <rect width="288" height="68" rx="14" fill="#FFFFFF" filter="url(#cardSh2)"/>
    <circle cx="36" cy="34" r="18" fill="#DBEAFE"/>
    <text x="36" y="39" text-anchor="middle" fill="#1D4ED8" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">RD</text>
    <text x="66" y="28" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Rahul Das</text>
    <text x="66" y="44" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">Class 9 • Mathematics</text>
    <!-- Badge -->
    <rect x="226" y="20" width="48" height="20" rx="10" fill="#DCFCE7"/>
    <text x="250" y="34" text-anchor="middle" fill="#15803D" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Active</text>
    <text x="66" y="58" fill="#10B981" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">● Fees Paid (Apr)</text>
  </g>

  <!-- Student Card 2: Suman Roy -->
  <g transform="translate(16, 264)">
    <rect width="288" height="68" rx="14" fill="#FFFFFF" filter="url(#cardSh2)"/>
    <circle cx="36" cy="34" r="18" fill="#FEF3C7"/>
    <text x="36" y="39" text-anchor="middle" fill="#B45309" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">SR</text>
    <text x="66" y="28" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Suman Roy</text>
    <text x="66" y="44" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">Class 10 • Science</text>
    <rect x="226" y="20" width="48" height="20" rx="10" fill="#DCFCE7"/>
    <text x="250" y="34" text-anchor="middle" fill="#15803D" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Active</text>
    <text x="66" y="58" fill="#EF4444" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">● Due: ₹1,500</text>
  </g>

  <!-- Student Card 3: Priya Sahu -->
  <g transform="translate(16, 342)">
    <rect width="288" height="68" rx="14" fill="#FFFFFF" filter="url(#cardSh2)"/>
    <circle cx="36" cy="34" r="18" fill="#FCE7F3"/>
    <text x="36" y="39" text-anchor="middle" fill="#BE185D" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">PS</text>
    <text x="66" y="28" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Priya Sahu</text>
    <text x="66" y="44" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">Class 8 • English</text>
    <rect x="226" y="20" width="48" height="20" rx="10" fill="#DCFCE7"/>
    <text x="250" y="34" text-anchor="middle" fill="#15803D" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Active</text>
    <text x="66" y="58" fill="#10B981" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">● Fees Paid (Apr)</text>
  </g>

  <!-- Student Card 4: Amit Paul -->
  <g transform="translate(16, 420)">
    <rect width="288" height="68" rx="14" fill="#FFFFFF" filter="url(#cardSh2)"/>
    <circle cx="36" cy="34" r="18" fill="#EDE9FE"/>
    <text x="36" y="39" text-anchor="middle" fill="#6D28D9" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">AP</text>
    <text x="66" y="28" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Amit Paul</text>
    <text x="66" y="44" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">Class 10 • Mathematics</text>
    <rect x="226" y="20" width="48" height="20" rx="10" fill="#DCFCE7"/>
    <text x="250" y="34" text-anchor="middle" fill="#15803D" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Active</text>
    <text x="66" y="58" fill="#10B981" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">● Fees Paid (Apr)</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 580)">
    <rect width="320" height="60" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="320" y2="0" stroke="#E2E8F0"/>
    <circle cx="60" cy="24" r="4" fill="#94A3B8"/>
    <text x="60" y="44" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="9">Home</text>
    <circle cx="160" cy="24" r="4" fill="#1976D2"/>
    <text x="160" y="44" text-anchor="middle" fill="#1976D2" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">Students</text>
    <circle cx="260" cy="24" r="4" fill="#94A3B8"/>
    <text x="260" y="44" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="9">Settings</text>
  </g>
</svg>
