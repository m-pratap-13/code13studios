<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="dbHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <filter id="cardSh" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Device Screen BG -->
  <rect width="320" height="640" rx="36" fill="#F4F7FC"/>

  <!-- Status Bar -->
  <rect width="320" height="40" rx="36" fill="#1565C0"/>
  <rect width="320" height="20" fill="#1565C0"/>
  <text x="24" y="26" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">9:41</text>
  <!-- Dynamic Island Pill -->
  <rect x="120" y="8" width="80" height="18" rx="9" fill="#0A2540"/>
  <!-- Status Icons -->
  <circle cx="282" cy="22" r="3" fill="#FFFFFF"/>
  <path d="M294 18H304V26H294V18Z" fill="#FFFFFF"/>

  <!-- App Header -->
  <rect y="40" width="320" height="85" fill="url(#dbHeader)"/>
  <text x="20" y="68" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Dashboard</text>
  <text x="20" y="88" fill="#E3F2FD" font-family="-apple-system, sans-serif" font-size="12">Good Morning,</text>
  <text x="20" y="108" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Pratap Mondal</text>
  <!-- Profile Avatar in header -->
  <circle cx="285" cy="88" r="18" fill="#FFFFFF" fill-opacity="0.2"/>
  <text x="285" y="93" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">P</text>

  <!-- Stat summary cards -->
  <g transform="translate(16, 140)">
    <!-- Students Stat -->
    <rect width="90" height="74" rx="12" fill="#FFFFFF" filter="url(#cardSh)"/>
    <circle cx="32" cy="24" r="12" fill="#E3F2FD"/>
    <path d="M28 26C28 23 30 21 32 21C34 21 36 23 36 26" stroke="#1976D2" stroke-width="2" stroke-linecap="round"/>
    <circle cx="32" cy="18" r="3" fill="#1976D2"/>
    <text x="14" y="52" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">Students</text>
    <text x="14" y="68" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">48</text>

    <!-- Batches Stat -->
    <g transform="translate(98, 0)">
      <rect width="90" height="74" rx="12" fill="#FFFFFF" filter="url(#cardSh)"/>
      <circle cx="32" cy="24" r="12" fill="#FFF3E0"/>
      <rect x="26" y="20" width="12" height="9" rx="2" stroke="#F57C00" stroke-width="2"/>
      <text x="14" y="52" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">Batches</text>
      <text x="14" y="68" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">6</text>
    </g>

    <!-- Income Stat -->
    <g transform="translate(196, 0)">
      <rect width="92" height="74" rx="12" fill="#FFFFFF" filter="url(#cardSh)"/>
      <circle cx="32" cy="24" r="12" fill="#E8F5E9"/>
      <text x="32" y="28" text-anchor="middle" fill="#2E7D32" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">₹</text>
      <text x="14" y="52" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">Collection</text>
      <text x="14" y="68" fill="#2E7D32" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">₹68,000</text>
    </g>
  </g>

  <!-- Due Alert Banner -->
  <g transform="translate(16, 226)">
    <rect width="288" height="52" rx="12" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1"/>
    <circle cx="32" cy="26" r="10" fill="#FFE4E6"/>
    <text x="32" y="30" text-anchor="middle" fill="#E11D48" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">!</text>
    <text x="52" y="24" fill="#9F1239" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Pending Fees This Month</text>
    <text x="52" y="40" fill="#E11D48" font-family="-apple-system, sans-serif" font-size="11">Total Due: ₹12,800 (8 students)</text>
  </g>

  <!-- Quick Menu Grid (Reference exact: Students, Batches, Payments, Reports) -->
  <text x="18" y="304" fill="#1E293B" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Quick Actions</text>
  <g transform="translate(16, 314)">
    <!-- Students -->
    <rect width="138" height="84" rx="14" fill="#FFFFFF" filter="url(#cardSh)"/>
    <circle cx="40" cy="36" r="16" fill="#E0F2FE"/>
    <path d="M34 40C34 36 37 33 40 33C43 33 46 36 46 40" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="40" cy="29" r="4" fill="#0284C7"/>
    <text x="66" y="36" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Students</text>
    <text x="66" y="52" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">Manage list</text>

    <!-- Batches -->
    <g transform="translate(150, 0)">
      <rect width="138" height="84" rx="14" fill="#FFFFFF" filter="url(#cardSh)"/>
      <circle cx="40" cy="36" r="16" fill="#FEF3C7"/>
      <rect x="33" y="30" width="14" height="12" rx="3" stroke="#D97706" stroke-width="2"/>
      <text x="66" y="36" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Batches</text>
      <text x="66" y="52" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">6 Active</text>
    </g>

    <!-- Payments -->
    <g transform="translate(0, 96)">
      <rect width="138" height="84" rx="14" fill="#FFFFFF" filter="url(#cardSh)"/>
      <circle cx="40" cy="36" r="16" fill="#FFEDD5"/>
      <rect x="32" y="31" width="16" height="11" rx="2" stroke="#EA580C" stroke-width="2"/>
      <line x1="32" y1="35" x2="48" y2="35" stroke="#EA580C" stroke-width="2"/>
      <text x="66" y="36" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Payments</text>
      <text x="66" y="52" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">Track dues</text>
    </g>

    <!-- Reports -->
    <g transform="translate(150, 96)">
      <rect width="138" height="84" rx="14" fill="#FFFFFF" filter="url(#cardSh)"/>
      <circle cx="40" cy="36" r="16" fill="#E0E7FF"/>
      <path d="M34 42V35M40 42V30M46 42V37" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round"/>
      <text x="66" y="36" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Reports</text>
      <text x="66" y="52" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">Analytics</text>
    </g>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 580)">
    <rect width="320" height="60" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="320" y2="0" stroke="#E2E8F0"/>
    <!-- Nav item 1 Active Home -->
    <circle cx="60" cy="24" r="4" fill="#1976D2"/>
    <text x="60" y="44" text-anchor="middle" fill="#1976D2" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">Home</text>
    <!-- Nav item 2 Students -->
    <circle cx="160" cy="24" r="4" fill="#94A3B8"/>
    <text x="160" y="44" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="9">Students</text>
    <!-- Nav item 3 More -->
    <circle cx="260" cy="24" r="4" fill="#94A3B8"/>
    <text x="260" y="44" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="9">Settings</text>
  </g>
</svg>
