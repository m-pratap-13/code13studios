<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 560" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="nuroBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Screen Body -->
  <rect width="280" height="560" rx="36" fill="url(#nuroBg)"/>

  <!-- Status Bar -->
  <rect width="280" height="34" rx="36" fill="#022C22"/>
  <rect width="280" height="18" fill="#022C22"/>
  <text x="22" y="23" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">9:41</text>
  <rect x="100" y="8" width="80" height="16" rx="8" fill="#011913"/>
  <circle cx="248" cy="20" r="3" fill="#FFFFFF"/>
  <path d="M256 16H264V24H256V16Z" fill="#FFFFFF"/>

  <!-- Center Content -->
  <g transform="translate(140, 190)">
    <!-- White Circular Badge with Location Pin -->
    <circle cx="0" cy="0" r="42" fill="#FFFFFF"/>
    <!-- Green Map Pin -->
    <path d="M0 -22C-12 -22 -20 -14 -20 -3C-20 10 0 24 0 24C0 24 20 10 20 -3C20 -14 12 -22 0 -22Z" fill="#059669"/>
    <circle cx="0" cy="-4" r="7" fill="#FFFFFF"/>

    <!-- App Title & Tagline -->
    <text x="0" y="74" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">NuroLexa</text>
    <text x="0" y="96" text-anchor="middle" fill="#A7F3D0" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">Service Hub</text>
  </g>

  <!-- Budapest City Skyline Silhouette at Bottom (matching reference) -->
  <g opacity="0.25" fill="#FFFFFF">
    <!-- Parliament dome / building silhouettes -->
    <rect x="10" y="460" width="18" height="100"/>
    <rect x="32" y="440" width="22" height="120"/>
    <polygon points="43,415 32,440 54,440"/>
    <rect x="58" y="470" width="24" height="90"/>
    <rect x="86" y="450" width="30" height="110"/>
    <polygon points="101,425 86,450 116,450"/>
    <circle cx="101" cy="425" r="4"/>
    <!-- Center big dome -->
    <rect x="120" y="465" width="40" height="95"/>
    <path d="M125 465 C125 425 155 425 155 465 Z"/>
    <rect x="138" y="405" width="4" height="20"/>
    <!-- Right skyline towers -->
    <rect x="164" y="450" width="30" height="110"/>
    <polygon points="179,425 164,450 194,450"/>
    <rect x="198" y="470" width="26" height="90"/>
    <rect x="228" y="440" width="22" height="120"/>
    <polygon points="239,415 228,440 250,440"/>
    <rect x="254" y="460" width="18" height="100"/>
  </g>
  <!-- Foreground ground wave -->
  <path d="M0 500 C80 480 180 515 280 490 V560 H0 Z" fill="#047857" opacity="0.6"/>
  <path d="M0 525 C90 510 190 535 280 515 V560 H0 Z" fill="#065F46" opacity="0.9"/>
</svg>
